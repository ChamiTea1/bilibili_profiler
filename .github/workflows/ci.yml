name: CI

# 离线回归 + 静态检查：不联网、不用 Cookie、不消耗 LLM 额度，秒级完成。
# 依赖只有 requirements.txt（全版本锁定）+ pyflakes。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regress:
    name: 离线回归 (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    env:
      # 用例会打印 ✔/✘ 与中文，Windows runner 默认控制台编码可能非 UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      # 长图用例会真实出图，需要系统 CJK 字体（ubuntu runner 默认没有，
      # Windows runner 自带 msyh/simhei）。不装的话该用例会走"无字体降级"分支，
      # Linux 上的出图路径就没人验证了。
      - name: 安装中文字体（Linux；长图渲染用例需要）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # 全新克隆没有 src/config.py（已 gitignore），run_all.py 会自动从模板生成
      - name: 跑离线回归与静态检查
        run: python tests/run_all.py --lint
